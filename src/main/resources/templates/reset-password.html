<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Redefinir senha — EVJ AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg-primary); }
        .auth-card { background:var(--bg-secondary); border:1px solid var(--border); border-radius:16px; padding:40px; width:100%; max-width:420px; box-shadow:0 8px 32px rgba(0,0,0,.3); }
        .auth-logo { text-align:center; margin-bottom:24px; }
        .auth-logo img { width:130px; height:130px; object-fit:contain; filter:drop-shadow(0 0 24px rgba(0,180,255,.45)); margin-bottom:12px; }
        .auth-logo span { display:block; font-size:1.6rem; font-weight:800; background:linear-gradient(135deg,#00b4ff,#f59e0b); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .auth-title { font-size:1.4rem; font-weight:700; margin-bottom:8px; }
        .auth-subtitle { color:var(--text-muted); font-size:.875rem; margin-bottom:28px; }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-size:.875rem; font-weight:500; margin-bottom:6px; }
        .form-group input { width:100%; padding:12px 14px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:8px; color:var(--text-primary); font-size:.9rem; box-sizing:border-box; }
        .form-group input:focus { outline:none; border-color:#00b4ff; }
        .form-group .hint { font-size:.78rem; color:var(--text-muted); margin-top:5px; }
        .btn-primary { width:100%; padding:13px; background:linear-gradient(135deg,#00b4ff,#0088cc); color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:6px; }
        .btn-primary:hover { opacity:.9; }
        .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
        .auth-footer { text-align:center; margin-top:20px; font-size:.85rem; color:var(--text-muted); }
        .auth-footer a { color:#00b4ff; text-decoration:none; }
        .alert-error   { background:rgba(239,68,68,.15);  border:1px solid rgba(239,68,68,.4);  color:#f87171; padding:12px; border-radius:8px; margin-bottom:18px; font-size:.875rem; }
        .alert-success { background:rgba(22,163,74,.15);  border:1px solid rgba(22,163,74,.4);  color:#4ade80; padding:12px; border-radius:8px; margin-bottom:18px; font-size:.875rem; }
        .icon-lock { font-size:2.5rem; text-align:center; margin-bottom:16px; }
        .email-display { background:var(--bg-tertiary); border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-size:.9rem; color:var(--text-secondary); margin-bottom:18px; }
        /* Barra de força da senha */
        .strength-bar-wrap { height:4px; background:var(--bg-tertiary); border-radius:2px; margin-top:6px; overflow:hidden; }
        .strength-bar { height:100%; width:0; border-radius:2px; transition:width .3s, background .3s; }
        .strength-label { font-size:.75rem; margin-top:4px; color:var(--text-muted); }
        /* Token inválido */
        .card-expired { text-align:center; padding:12px 0; }
        .card-expired p { color:var(--text-muted); margin:12px 0; }
    </style>
</head>
<body class="dark-mode">
<script>if(localStorage.getItem('theme')==='light'){document.body.classList.replace('dark-mode','light-mode');}</script>

<div class="auth-card">
    <div class="auth-logo">
        <img th:src="@{/images/logo_evj.jpg}" alt="EVJ AI"/>
    </div>

    <!-- Token inválido / expirado -->
    <div th:if="${error != null and token == null}" class="card-expired">
        <div class="icon-lock">⚠️</div>
        <div class="auth-title">Link inválido</div>
        <div class="alert-error" th:text="${error}"></div>
        <p>Solicite um novo link de redefinição:</p>
        <a th:href="@{/forgot-password}" class="btn-primary" style="display:block;text-align:center;text-decoration:none;padding:13px;margin-top:8px">
            Solicitar novo link
        </a>
    </div>

    <!-- Formulário de nova senha (token válido) -->
    <div th:if="${token != null}">
        <div class="icon-lock">🔐</div>
        <div class="auth-title">Nova senha</div>
        <div class="auth-subtitle">Escolha uma senha forte para proteger sua conta.</div>

        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <!-- E-mail do usuário (somente leitura, para o gerenciador de senhas) -->
        <div th:if="${email}" class="email-display" th:text="${email}"></div>

        <form th:action="@{/reset-password}" method="post" id="resetForm">
            <input type="hidden" name="token" th:value="${token}"/>
            <!-- Campo username oculto p/ gerenciadores de senha reconhecerem o contexto -->
            <input type="text" name="username" th:value="${email}" autocomplete="username"
                   style="display:none" aria-hidden="true"/>

            <div class="form-group">
                <label for="password">Nova senha</label>
                <input type="password" id="password" name="password" required
                       autocomplete="new-password" placeholder="Mínimo 8 caracteres"
                       minlength="8" oninput="checkStrength(this.value)"/>
                <div class="strength-bar-wrap"><div class="strength-bar" id="strengthBar"></div></div>
                <div class="strength-label" id="strengthLabel"></div>
                <div class="hint">Mínimo 8 caracteres. Use letras, números e símbolos.</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar nova senha</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                       autocomplete="new-password" placeholder="Repita a nova senha"
                       oninput="checkMatch()"/>
                <div class="hint" id="matchHint"></div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Redefinir senha</button>
        </form>
    </div>

    <div class="auth-footer" th:if="${token != null}">
        <a th:href="@{/login}">Voltar ao login</a>
    </div>
</div>

<script>
function checkStrength(val) {
    const bar = document.getElementById('strengthBar');
    const label = document.getElementById('strengthLabel');
    let score = 0;
    if (val.length >= 8)  score++;
    if (val.length >= 12) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const levels = [
        { pct: '20%', color: '#ef4444', text: 'Muito fraca' },
        { pct: '40%', color: '#f97316', text: 'Fraca' },
        { pct: '60%', color: '#eab308', text: 'Razoável' },
        { pct: '80%', color: '#22c55e', text: 'Forte' },
        { pct: '100%', color: '#16a34a', text: 'Muito forte 💪' },
    ];
    if (val.length === 0) { bar.style.width = '0'; label.textContent = ''; return; }
    const lvl = levels[Math.min(score - 1, 4)];
    bar.style.width  = lvl.pct;
    bar.style.background = lvl.color;
    label.textContent = lvl.text;
    label.style.color = lvl.color;
}

function checkMatch() {
    const pwd  = document.getElementById('password').value;
    const conf = document.getElementById('confirmPassword').value;
    const hint = document.getElementById('matchHint');
    if (!conf) { hint.textContent = ''; return; }
    if (pwd === conf) {
        hint.textContent = '✓ Senhas conferem';
        hint.style.color = '#22c55e';
    } else {
        hint.textContent = '✗ Senhas não conferem';
        hint.style.color = '#ef4444';
    }
}

document.getElementById('resetForm')?.addEventListener('submit', function(e) {
    const pwd  = document.getElementById('password').value;
    const conf = document.getElementById('confirmPassword').value;
    if (pwd !== conf) {
        e.preventDefault();
        document.getElementById('matchHint').textContent = '✗ Senhas não conferem';
        document.getElementById('matchHint').style.color = '#ef4444';
        return;
    }
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('submitBtn').textContent = 'Redefinindo...';
});
</script>
</body>
</html>
