<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="pt-BR">
<head>
    <title>Histórico - EVJ AI</title>
</head>
<body>
<div layout:fragment="content">
<div class="history-page">
    <div class="page-header">
        <h1><i class="bi bi-clock-history"></i> Histórico Completo</h1>
    </div>

    <!-- Conversations Tab -->
    <div class="tab-content active" id="convTab">
        <div class="tab-actions">
            <button class="btn-danger-small" onclick="clearAllConversations()">
                <i class="bi bi-trash3"></i> Limpar Todas
            </button>
        </div>
        <div class="history-list">
            <a th:each="conv : ${conversations}"
               th:href="@{/chat(id=${conv.id})}"
               class="history-item">
                <div class="hist-icon"><i class="bi bi-chat-dots-fill"></i></div>
                <div class="hist-info">
                    <span class="hist-title" th:text="${conv.title}">Título</span>
                    <div class="hist-meta">
                        <span th:text="${conv.modelId}">model</span>
                        <span>•</span>
                        <span th:text="${#lists.size(conv.messages)} + ' mensagens'">0</span>
                        <span>•</span>
                        <span th:text="${#temporals.format(conv.updatedAt, 'dd/MM/yyyy HH:mm')}">data</span>
                        <span th:if="${conv.estimatedCost > 0}">•</span>
                        <span th:if="${conv.estimatedCost > 0}"
                              th:text="'$' + ${#numbers.formatDecimal(conv.estimatedCost, 1, 6)}">cost</span>
                    </div>
                </div>
                <div class="hist-actions">
                    <button class="hist-action-btn"
                            th:data-id="${conv.id}"
                            onclick="deleteHistConversation(this.dataset.id, event)">
                        <i class="bi bi-trash3"></i>
                    </button>
                </div>
            </a>
            <div th:if="${#lists.isEmpty(conversations)}" class="history-empty">
                <i class="bi bi-chat-dots"></i>
                <p>Nenhuma conversa no histórico</p>
            </div>
        </div>
    </div>
</div>

<script>
    function clearAllConversations() {
        if (confirm('Tem certeza? Isso apagará todas as conversas.')) {
            fetch('/api/history/conversations', {method: 'DELETE'})
                .then(() => window.location.reload());
        }
    }

    function deleteHistConversation(id, event) {
        event.preventDefault();
        if (confirm('Apagar esta conversa?')) {
            fetch('/api/chat/conversation/' + id, {method: 'DELETE'})
                .then(() => window.location.reload());
        }
    }
</script>
</div>
</body>
</html>
