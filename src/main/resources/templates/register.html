<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastrar — EVJ AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body class="dark-mode auth-page">
<div class="auth-card">
    <div class="auth-logo">
        <img th:src="@{/images/logo_evj.jpg}" alt="EVJ AI"/>
    </div>
    <div class="auth-title">Cadastrar</div>

    <div class="info-box">
        🔒 O acesso é restrito e requer validação por e-mail.
    </div>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <div class="form-group">
            <label for="name">Nome completo</label>
            <input type="text" id="name" name="name" required placeholder="Seu nome"/>
        </div>
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="seu@email.com"/>
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres"/>
            <div class="hint">Mínimo de 8 caracteres</div>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirmar senha</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Repita a senha"/>
        </div>
        <button type="submit" class="btn-primary">Cadastrar</button>
    </form>

    <div class="auth-footer">
        Já tem conta? <a th:href="@{/login}">Fazer login</a>
    </div>
</div>
</body>
</html>
