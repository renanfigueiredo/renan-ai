<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Aguardando Aprovação — EVJ AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg-primary); }
        .auth-card { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:16px; padding:48px 40px; width:100%; max-width:480px; text-align:center; box-shadow:0 8px 32px rgba(0,0,0,.3); }
        .icon { font-size:4rem; margin-bottom:20px; }
        .auth-title { font-size:1.5rem; font-weight:700; margin-bottom:12px; }
        .auth-subtitle { color:var(--text-muted); line-height:1.6; margin-bottom:28px; }
        .auth-footer a { color:#00b4ff; text-decoration:none; font-size:.875rem; }
    </style>
</head>
<body class="dark-mode">
<script>if(localStorage.getItem('theme')==='light'){document.body.classList.replace('dark-mode','light-mode');}</script>
<div class="auth-card">
    <div class="icon">⏳</div>
    <div class="auth-title">Solicitação enviada!</div>
    <div class="auth-subtitle">
        Seu cadastro foi recebido e está <strong>aguardando aprovação</strong>.<br/><br/>
        O administrador receberá um e-mail com sua solicitação e irá aprovar ou rejeitar o acesso em breve.<br/><br/>
        Você receberá um e-mail de confirmação assim que sua conta for ativada.
    </div>
    <div class="auth-footer"><a th:href="@{/login}">← Voltar para o login</a></div>
</div>
</body>
</html>
