<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Aguardando Aprovação — EVJ AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body class="dark-mode auth-page">
<div class="auth-card text-center">
    <div class="icon">⏳</div>
    <div class="auth-title">Solicitação enviada!</div>
    <div class="auth-subtitle">
        Seu cadastro foi recebido e está <strong>aguardando aprovação</strong>.<br/><br/>
        O administrador receberá um e-mail com sua solicitação e irá aprovar ou rejeitar o acesso em breve.<br/><br/>
        Você receberá um e-mail de confirmação assim que sua conta for ativada.
    </div>
    <div class="auth-footer"><a th:href="@{/login}">← Voltar para o login</a></div>
</div>
</body>
</html>
