<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Esqueci minha senha — EVJ AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body class="dark-mode auth-page">
<div class="auth-card">
    <div class="auth-logo">
        <img th:src="@{/images/logo_evj.jpg}" alt="EVJ AI"/>
    </div>
    <div class="icon-lock">🔑</div>
    <div class="auth-title">Esqueci minha senha</div>
    <div class="auth-subtitle">Informe seu e-mail e enviaremos um link para redefinir sua senha.</div>

    <div th:if="${error}"   class="alert-error"   th:text="${error}"></div>
    <div th:if="${message}" class="alert-success" th:text="${message}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="seu@email.com"
                   autofocus/>
        </div>
        <button type="submit" class="btn-primary">Enviar link de redefinição</button>
    </form>

    <div class="auth-footer">
        Lembrou a senha? <a th:href="@{/login}">Voltar ao login</a>
    </div>
</div>
</body>
</html>
