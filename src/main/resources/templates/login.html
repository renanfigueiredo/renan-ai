<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — EVJ AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/login.css}"/>
</head>
<body class="dark-mode">

<!-- Animated background orbs -->
<div class="orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="lp-root">

    <!-- ═══ LEFT PANEL ═══ -->
    <div class="lp-left">
        <img th:src="@{/images/logo_evj.jpg}" alt="EVJ AI" class="lp-logo"/>
        <h1 class="lp-tagline">IA <span>baseada na bíblia</span>.</h1>
        <div class="lp-features">
            <div class="lp-feat">
                <div class="feat-icon cyan"><i class="bi bi-chat-dots-fill"></i></div>
                <div class="feat-text"><strong>Perguntas</strong><span>Converse sobre fé, Bíblia e oração</span></div>
            </div>
            <div class="lp-feat">
                <div class="feat-icon blue"><i class="bi bi-book-fill"></i></div>
                <div class="feat-text"><strong>Respostas</strong><span>Baseadas no fundamento Cristão</span></div>
            </div>
        </div>
    </div>

    <div class="lp-divider"></div>

    <!-- ═══ RIGHT PANEL ═══ -->
    <div class="lp-right">
        <div class="lp-form-card">

            <div class="lp-mobile-header">
                <img th:src="@{/images/logo_evj.jpg}" alt="EVJ AI" class="lp-mobile-logo"/>
            </div>
            <div class="lp-form-title">Bem-vindo!</div>

            <!-- Alerts -->
            <div th:if="${error}" class="lp-alert lp-alert-error">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${error}"></span>
            </div>
            <div th:if="${message}" class="lp-alert lp-alert-success">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${message}"></span>
            </div>
            <div id="guestError" class="lp-alert lp-alert-error" style="display:none">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span id="guestErrorText"></span>
            </div>

            <!-- Login form -->
            <form th:action="@{/login}" method="post" autocomplete="on">
                <div class="lp-field">
                    <input type="email" id="username" name="username"
                           placeholder="E-mail" required autocomplete="email"/>
                    <label for="username">E-mail</label>
                    <i class="bi bi-envelope lp-field-icon"></i>
                </div>
                <div class="lp-field">
                    <input type="password" id="password" name="password"
                           placeholder="Senha" required autocomplete="current-password"/>
                    <label for="password">Senha</label>
                    <button type="button" class="lp-pwd-toggle" onclick="togglePwd()" title="Mostrar/ocultar senha" aria-label="Alternar visibilidade da senha">
                        <i class="bi bi-eye" id="pwdIcon"></i>
                    </button>
                </div>
                <div class="lp-forgot"><a th:href="@{/forgot-password}">Esqueci minha senha</a></div>
                <button type="submit" class="lp-btn-submit">
                    <i class="bi bi-box-arrow-in-right btn-icon-left"></i>Entrar
                </button>
            </form>

            <div class="lp-sep">ou</div>

            <button class="lp-btn-guest" id="btnGuest" onclick="startGuestMode()">
                <span class="lp-guest-dot"></span>
                Testar IA como Visitante
            </button>

            <div class="lp-footer">
                <span>Não tem conta?</span>
                <a th:href="@{/register}">Cadastrar</a>
            </div>

        </div>
    </div>

</div><!-- /.lp-root -->

<script>
/* ── Password visibility ── */
function togglePwd() {
    const inp  = document.getElementById('password');
    const icon = document.getElementById('pwdIcon');
    if (inp.type === 'password') { inp.type = 'text'; icon.className = 'bi bi-eye-slash'; }
    else                         { inp.type = 'password'; icon.className = 'bi bi-eye'; }
}

/* ── Guest error helper ── */
function showGuestError(msg) {
    const el = document.getElementById('guestError');
    document.getElementById('guestErrorText').textContent = msg;
    el.style.display = 'flex';
}

/* ── Browser fingerprint (canvas + WebGL + hw + tz) ── */
async function computeFingerprint() {
    const parts = [
        navigator.userAgent,
        navigator.language || '',
        (navigator.languages || []).join(','),
        screen.width + 'x' + screen.height + 'x' + screen.colorDepth,
        new Date().getTimezoneOffset(),
        navigator.hardwareConcurrency || 0,
        navigator.platform || '',
        Intl.DateTimeFormat().resolvedOptions().timeZone || '',
    ];
    try {
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        ctx.textBaseline = 'top';
        ctx.font = '14px "Arial"';
        ctx.fillStyle = '#0e0a1a';
        ctx.fillRect(0, 0, 200, 30);
        ctx.fillStyle = '#00ccff';
        ctx.fillText('EVJAI\u{270F}fp', 2, 8);
        ctx.strokeStyle = 'rgba(0,224,90,0.7)';
        ctx.beginPath(); ctx.arc(100, 15, 12, 0, Math.PI * 2); ctx.stroke();
        parts.push(c.toDataURL());
    } catch(_) {}
    try {
        const gl = document.createElement('canvas').getContext('webgl');
        if (gl) {
            const dbg = gl.getExtension('WEBGL_debug_renderer_info');
            if (dbg) parts.push(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
        }
    } catch(_) {}
    const raw = parts.join('||');
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

/* ── Guest mode ── */
async function startGuestMode() {
    const btn = document.getElementById('btnGuest');
    document.getElementById('guestError').style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<span class="lp-guest-dot" style="background:#f59e0b;box-shadow:0 0 6px #f59e0b"></span> Verificando...';

    try {
        const fp = await computeFingerprint();
        localStorage.setItem('_rfp', fp);

        const resp = await fetch('/guest/start', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({fingerprint: fp})
        });
        const data = await resp.json();

        if (data.ok) {
            window.location.href = '/';
        } else {
            showGuestError(data.message || 'Não foi possível iniciar o modo visitante.');
            btn.disabled = false;
            btn.innerHTML = '<span class="lp-guest-dot"></span> Explorar como Visitante — 1 hora grátis';
        }
    } catch(e) {
        showGuestError('Erro de conexão. Tente novamente.');
        btn.disabled = false;
        btn.innerHTML = '<span class="lp-guest-dot"></span> Explorar como Visitante — 1 hora grátis';
    }
}

/* ── ?guest=expired ── */
if (new URLSearchParams(location.search).get('guest') === 'expired') {
    showGuestError('Seu tempo de visita expirou. Crie uma conta para continuar usando o EVJ AI.');
}
</script>
</body>
</html>
