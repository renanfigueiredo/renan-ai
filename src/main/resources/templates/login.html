<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — Renan AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg-primary); }
        .auth-card { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:16px; padding:40px; width:100%; max-width:420px; box-shadow:0 8px 32px rgba(0,0,0,.3); }
        .auth-logo { text-align:center; margin-bottom:32px; }
        .auth-logo span { font-size:2rem; font-weight:800; background:linear-gradient(135deg,var(--purple),var(--blue)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .auth-title { font-size:1.4rem; font-weight:700; margin-bottom:8px; }
        .auth-subtitle { color:var(--text-muted); font-size:.875rem; margin-bottom:28px; }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-size:.875rem; font-weight:500; margin-bottom:6px; }
        .form-group input { width:100%; padding:12px 14px; background:var(--bg-tertiary); border:1px solid var(--border-color); border-radius:8px; color:var(--text-primary); font-size:.9rem; box-sizing:border-box; }
        .form-group input:focus { outline:none; border-color:var(--purple); }
        .btn-primary { width:100%; padding:13px; background:linear-gradient(135deg,var(--purple),var(--blue)); color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:6px; }
        .btn-primary:hover { opacity:.9; }
        .auth-footer { text-align:center; margin-top:20px; font-size:.85rem; color:var(--text-muted); }
        .auth-footer a { color:var(--purple); text-decoration:none; }
        .alert-error { background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.4); color:#f87171; padding:12px; border-radius:8px; margin-bottom:18px; font-size:.875rem; }
        .alert-success { background:rgba(22,163,74,.15); border:1px solid rgba(22,163,74,.4); color:#4ade80; padding:12px; border-radius:8px; margin-bottom:18px; font-size:.875rem; }
    </style>
</head>
<body class="dark-mode">
<script>if(localStorage.getItem('theme')==='light'){document.body.classList.replace('dark-mode','light-mode');}</script>
<div class="auth-card">
    <div class="auth-logo"><span>Renan AI</span></div>
    <div class="auth-title">Bem-vindo de volta</div>
    <div class="auth-subtitle">Entre com seu e-mail e senha para continuar</div>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>
    <div th:if="${message}" class="alert-success" th:text="${message}"></div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">E-mail</label>
            <input type="email" id="username" name="username" required autocomplete="email" placeholder="seu@email.com"/>
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••"/>
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <div class="auth-footer">
        Não tem conta? <a th:href="@{/register}">Solicitar acesso</a>
    </div>
</div>
</body>
</html>
