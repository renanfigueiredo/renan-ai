<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ação Realizada — EVJ AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
</head>
<body class="dark-mode auth-page">
<div class="auth-card text-center">
    <div th:if="${success}">
        <div class="icon" th:text="${action == 'aprovado'} ? '✅' : '🚫'"></div>
        <div class="auth-title" th:text="'Usuário ' + ${action} + ' com sucesso.'"></div>
        <div class="auth-subtitle">O usuário foi notificado por e-mail.</div>
    </div>
    <div th:unless="${success}">
        <div class="icon">❌</div>
        <div class="auth-title">Link inválido ou expirado.</div>
        <div class="auth-subtitle">Este link de aprovação já foi utilizado ou não existe.</div>
    </div>
</div>
</body>
</html>
