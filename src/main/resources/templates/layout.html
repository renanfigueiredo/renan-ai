<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renan AI - Plataforma Ultra-Inteligente</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300d4ff'/%3E%3Cstop offset='100%25' stop-color='%23f59e0b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpolygon points='20,1 37,10 37,30 20,39 3,30 3,10' fill='%2300b4ff' opacity='.15' stroke='url(%23g)' stroke-width='1.5'/%3E%3Ccircle cx='20' cy='1' r='2.2' fill='url(%23g)'/%3E%3Ccircle cx='37' cy='10' r='2.2' fill='url(%23g)'/%3E%3Ccircle cx='37' cy='30' r='2.2' fill='%23f59e0b'/%3E%3Ccircle cx='20' cy='39' r='2.2' fill='%23f59e0b'/%3E%3Ccircle cx='3' cy='30' r='2.2' fill='url(%23g)'/%3E%3Ccircle cx='3' cy='10' r='2.2' fill='url(%23g)'/%3E%3Ctext x='11' y='28' font-family='Arial' font-weight='900' font-size='21' fill='url(%23g)'%3ER%3C/text%3E%3C/svg%3E">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- Highlight.js for code -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <!-- Highlight.js for code -->
    <link rel="canonical" th:href="@{https://www.renan-ai.com.br}" />
</head>
<body class="dark-mode">
<!-- Anti-FOUC: apply saved theme before first paint -->
<script>if(localStorage.getItem('theme')==='light'){document.body.classList.replace('dark-mode','light-mode');}</script>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a th:href="@{/}" class="logo" title="Renan AI – Início">
            <span class="logo-icon">
                <img th:src="@{/images/logo_mini.png}" alt="Renan AI" class="sidebar-logo-img"/>
            </span>
        </a>
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle Sidebar">
            <i class="bi bi-layout-sidebar"></i>
        </button>
    </div>

    <nav class="sidebar-nav">
        <a th:href="@{/}" class="nav-item" th:classappend="${activeTab == 'home'} ? 'active' : ''">
            <i class="bi bi-house-fill"></i>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/chat}" class="nav-item" th:classappend="${activeTab == 'chat'} ? 'active' : ''">
            <i class="bi bi-chat-dots-fill"></i>
            <span>Chat & Texto</span>
        </a>
        <a th:href="@{/image}" class="nav-item" th:classappend="${activeTab == 'image'} ? 'active' : ''">
            <i class="bi bi-image-fill"></i>
            <span>Geração de Imagens</span>
        </a>
        <a th:href="@{/video}" class="nav-item" th:classappend="${activeTab == 'video'} ? 'active' : ''">
            <i class="bi bi-film"></i>
            <span>Geração de Vídeos</span>
        </a>
    </nav>

    <div class="sidebar-logo-showcase">
        <img th:src="@{/images/logo.png}" alt="Renan AI" class="sidebar-hero-logo"/>
    </div>

    <div class="sidebar-footer">
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Alternar tema">
            <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
            <span id="themeLabel">Modo Escuro</span>
        </button>
    </div>
</aside>

<!-- Main Content -->
<main class="main-content" id="mainContent">
    <!-- Top Bar -->
    <header class="topbar">
        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i class="bi bi-list"></i>
        </button>
        <a th:href="@{/}" class="topbar-brand" id="topbarTitle">
            <img th:src="@{/images/logo_texto.png}" alt="Renan AI" class="topbar-logo-img"/>
        </a>
        <div class="topbar-actions">
            <!-- Theme toggle -->
            <button class="topbar-theme-btn" id="topbarThemeBtn" onclick="toggleTheme()" title="Modo Claro">
                <i class="bi bi-brightness-high"></i>
            </button>
            <div class="status-indicator online" title="AWS Bedrock Conectado">
                <span class="status-dot"></span>
                <span class="status-text">Bedrock Online</span>
            </div>
            <!-- Logged-in user dropdown -->
            <div class="user-menu" sec:authorize="isAuthenticated()" id="userMenu">
                <button class="user-menu-btn" id="userMenuBtn" title="Minha conta">
                    <span class="user-avatar" id="userAvatarInitial">?</span>
                    <span class="user-menu-name" id="userMenuName">...</span>
                    <i class="bi bi-chevron-down user-menu-chevron"></i>
                </button>
                <div class="user-dropdown" id="userDropdown">
                    <div class="user-dropdown-header">
                        <span class="user-dropdown-avatar" id="userDropdownAvatar">?</span>
                        <div>
                            <div class="user-dropdown-name" id="userDropdownName">...</div>
                            <div class="user-dropdown-email" id="userDropdownEmail">...</div>
                        </div>
                    </div>
                    <div class="user-dropdown-divider"></div>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="user-dropdown-item user-dropdown-logout">
                            <i class="bi bi-box-arrow-right"></i> Sair da conta
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <!-- Guest Mode Timer Banner -->
    <div sec:authorize="hasRole('GUEST')" class="guest-timer-banner" id="guestTimerBanner">
        <i class="bi bi-clock-history"></i>
        <span>Modo Visitante &mdash; <strong id="guestTimerDisplay">--:--</strong> restantes</span>
        <a th:href="@{/register}" class="guest-timer-cta">Solicitar Conta</a>
    </div>

    <!-- Page Content -->
    <div class="page-content" layout:fragment="content">
        <!-- Content injected by child pages -->
    </div>
</main>

<!-- Toast Notifications -->
<div class="toast-container" id="toastContainer"></div>

<!-- Global Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay" style="display:none">
    <div class="loading-content">
        <div class="loading-spinner"></div>
        <p id="loadingText">Processando...</p>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script th:src="@{/js/app.js(v=20260316)}"></script>
</body>
</html>
