<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renan AI - Plataforma Ultra-Inteligente</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236c63ff'/%3E%3Cstop offset='100%25' stop-color='%2300d4ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpolygon points='20,1 37,10 37,30 20,39 3,30 3,10' fill='%236c63ff' opacity='.18' stroke='url(%23g)' stroke-width='1.5'/%3E%3Ccircle cx='20' cy='1' r='2.2' fill='url(%23g)'/%3E%3Ccircle cx='37' cy='10' r='2.2' fill='url(%23g)'/%3E%3Ccircle cx='37' cy='30' r='2.2' fill='url(%23g)'/%3E%3Ccircle cx='20' cy='39' r='2.2' fill='url(%23g)'/%3E%3Ccircle cx='3' cy='30' r='2.2' fill='url(%23g)'/%3E%3Ccircle cx='3' cy='10' r='2.2' fill='url(%23g)'/%3E%3Ctext x='11' y='28' font-family='Arial' font-weight='900' font-size='21' fill='url(%23g)'%3ER%3C/text%3E%3C/svg%3E">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- Highlight.js for code -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body class="dark-mode">
<!-- Anti-FOUC: apply saved theme before first paint -->
<script>if(localStorage.getItem('theme')==='light'){document.body.classList.replace('dark-mode','light-mode');}</script>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a th:href="@{/}" class="logo" title="Renan AI – Início">
            <span class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="36" height="36" aria-label="Renan AI">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#7c6fff"/>
                            <stop offset="55%" stop-color="#4f9fff"/>
                            <stop offset="100%" stop-color="#00d4ff"/>
                        </linearGradient>
                        <linearGradient id="logoFill" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.28"/>
                            <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.12"/>
                        </linearGradient>
                    </defs>
                    <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="url(#logoFill)" stroke="url(#logoGrad)" stroke-width="1.8" stroke-linejoin="round"/>
                    <line x1="20" y1="2" x2="20" y2="38" stroke="url(#logoGrad)" stroke-width="0.6" opacity="0.22"/>
                    <line x1="4" y1="11" x2="36" y2="29" stroke="url(#logoGrad)" stroke-width="0.6" opacity="0.22"/>
                    <line x1="36" y1="11" x2="4" y2="29" stroke="url(#logoGrad)" stroke-width="0.6" opacity="0.22"/>
                    <circle cx="20" cy="2" r="2.4" fill="url(#logoGrad)"/>
                    <circle cx="36" cy="11" r="2.4" fill="url(#logoGrad)"/>
                    <circle cx="36" cy="29" r="2.4" fill="url(#logoGrad)"/>
                    <circle cx="20" cy="38" r="2.4" fill="url(#logoGrad)"/>
                    <circle cx="4" cy="29" r="2.4" fill="url(#logoGrad)"/>
                    <circle cx="4" cy="11" r="2.4" fill="url(#logoGrad)"/>
                    <text x="11.5" y="28.5" font-family="Inter,Arial,sans-serif" font-weight="900" font-size="20" fill="url(#logoGrad)" letter-spacing="-0.5">R</text>
                </svg>
            </span>
        </a>
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle Sidebar">
            <i class="bi bi-layout-sidebar"></i>
        </button>
    </div>

    <nav class="sidebar-nav">
        <a th:href="@{/}" class="nav-item" th:classappend="${activeTab == 'home'} ? 'active' : ''">
            <i class="bi bi-house-fill"></i>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/chat}" class="nav-item" th:classappend="${activeTab == 'chat'} ? 'active' : ''">
            <i class="bi bi-chat-dots-fill"></i>
            <span>Chat & Texto</span>
        </a>
        <a th:href="@{/image}" class="nav-item" th:classappend="${activeTab == 'image'} ? 'active' : ''">
            <i class="bi bi-image-fill"></i>
            <span>Geração de Imagens</span>
        </a>
        <a th:href="@{/video}" class="nav-item" th:classappend="${activeTab == 'video'} ? 'active' : ''">
            <i class="bi bi-film"></i>
            <span>Geração de Vídeos</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Alternar tema">
            <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
            <span id="themeLabel">Modo Escuro</span>
        </button>
    </div>
</aside>

<!-- Main Content -->
<main class="main-content" id="mainContent">
    <!-- Top Bar -->
    <header class="topbar">
        <button class="mobile-menu-btn" id="mobileMenuBtn">
            <i class="bi bi-list"></i>
        </button>
        <a th:href="@{/}" class="topbar-brand" id="topbarTitle"><span class="topbar-brand-name">Renan</span><span class="topbar-brand-ai"> AI</span></a>
        <div class="topbar-actions">
            <!-- Theme toggle — always visible on mobile, hides on desktop (sidebar button is used there) -->
            <button class="topbar-theme-btn" id="topbarThemeBtn" onclick="toggleTheme()" title="Modo Claro">
                <i class="bi bi-brightness-high"></i>
            </button>
            <div class="status-indicator online" title="AWS Bedrock Conectado">
                <span class="status-dot"></span>
                <span class="status-text">Bedrock Online</span>
            </div>
        </div>
    </header>

    <!-- Page Content -->
    <div class="page-content" layout:fragment="content">
        <!-- Content injected by child pages -->
    </div>
</main>

<!-- Toast Notifications -->
<div class="toast-container" id="toastContainer"></div>

<!-- Global Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay" style="display:none">
    <div class="loading-content">
        <div class="loading-spinner"></div>
        <p id="loadingText">Processando...</p>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
