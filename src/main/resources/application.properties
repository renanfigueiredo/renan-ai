# Server
server.port=${PORT:8080}
# Disable Tomcat connection timeout for SSE streaming
server.connection-timeout=-1
spring.application.name=EVJ AI

# AWS Bedrock Configuration
# As credenciais reais ficam em application-local.properties (ignorado pelo git)
# Veja: src/main/resources/application-local.properties.template
spring.config.import=optional:classpath:application-local.properties
aws.access-key-id=${AWS_ACCESS_KEY_ID:CONFIGURE_ME}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:CONFIGURE_ME}
aws.region=us-east-1
aws.s3.output-bucket=generator-repository

# =============================================================
# DATABASE – PostgreSQL (Heroku Postgres uses JDBC_DATABASE_URL)
# =============================================================
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/aimaster}
spring.datasource.username=${JDBC_DATABASE_USERNAME:aimaster_user}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:aimaster_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP – limit connections (Heroku free tier has 25 connection limit)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.keepalive-time=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =============================================================
# MAIL – Mailgun HTTP API (sem SMTP, usa API key diretamente)
# Heroku: set MAILGUN_API_KEY e MAILGUN_DOMAIN como config vars
# =============================================================
mailgun.api-key=${MAILGUN_API_KEY:CONFIGURE_ME}
mailgun.domain=${MAILGUN_DOMAIN:evj.app.br}

# =============================================================
# App
# =============================================================
# Base URL used in approval e-mail links
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.admin-email=evj.inven@gmail.com
# Remetente – deve ser um endereço do domínio configurado no Mailgun
app.mail-from=${MAIL_FROM:EVJ AI <postmaster@evj.app.br>}

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload (for images/documents)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.aimaster=DEBUG
logging.level.software.amazon=WARN
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Async
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100

#https forced
server.forward-headers-strategy=native