# =============================================================
# Profile PROD — produção (Heroku, etc.)
# Ative com: -Dspring.profiles.active=prod   ou   SPRING_PROFILES_ACTIVE=prod
# =============================================================

# Em produção, NUNCA modifique schema automaticamente.
# Use Flyway / Liquibase ou migrations manuais para mudar o BD.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Logging conservador — não vazar PII em logs
logging.level.com.aimaster=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.software.amazon=WARN

# Thymeleaf cache habilitado para performance
spring.thymeleaf.cache=true

# DevTools desabilitado
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Cookies de sessão seguros em produção
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Pool de conexões um pouco maior em prod
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3

# Compressão de resposta
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1024

# Actuator exposto apenas para health/info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
