# =============================================================
# Profile DEV — local, com logging verboso e ddl-auto=update
# Ative com: -Dspring.profiles.active=dev
# =============================================================

# Schema gerenciado automaticamente em dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging mais detalhado para debug local
logging.level.com.aimaster=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# Thymeleaf sem cache para hot-reload
spring.thymeleaf.cache=false

# DevTools (somente local)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
